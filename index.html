<script>
(function(){
  try {
    var filter = function(m) {
      if (!m) return false;
      var s = typeof m === 'string' ? m : (m.message || String(m));
      return /AI Studio|HMR|hmr|vite|WebSocket|webpackHotUpdate/i.test(s);
    };
    ['log', 'warn', 'info', 'debug', 'error'].forEach(function(k) {
      var orig = console[k];
      console[k] = function() {
        for (var i = 0; i < arguments.length; i++) {
          if (filter(arguments[i])) return;
        }
        orig.apply(console, arguments);
      };
    });
  } catch(e) {}
})();
</script>
